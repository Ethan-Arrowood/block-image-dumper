name: Build & attach release JAR

# When a GitHub Release is published (which creates its tag), build the mod and
# attach the JAR to that release. Manual dispatch is also allowed for testing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Attach JAR to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload the mod JAR (not the -sources jar) to the release that fired this run.
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          echo "Uploading $jar to ${{ github.event.release.tag_name }}"
          gh release upload "${{ github.event.release.tag_name }}" "$jar" --clobber \
            --repo "${{ github.repository }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-image-dumper-jar
          path: build/libs/*.jar
